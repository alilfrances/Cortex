name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        # Run optional-feature tests that were present when coverage floors were measured.
        run: python -m pip install -e ".[llm,watch,dev,semantic,tokens]" tree-sitter-cpp==0.23.4 build twine

      - name: Prepare locked parser runtime
        run: python -m cortex runtime setup

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Enforce per-module coverage floors
        # Floors live in tests/coverage_floors.toml (measured at 7b0e6e0 - 2 points,
        # raise-only). The suite runs a second time here with coverage collection.
        run: >-
          python -m pytest tests/ -q --cov=cortex --cov-report=json:coverage.json
          && python scripts/check_coverage_floors.py

      - name: Run explicit regex fallback suite
        env:
          CORTEX_FORCE_REGEX: "1"
          CORTEX_RUNTIME_NETWORK: "0"
        run: >-
          python -m pytest -q
          tests/test_structural_dispatch.py
          tests/test_qt_relations.py
          tests/test_qt_emits.py
          tests/test_context_mcp.py
          tests/test_qml_full_support.py
          tests/test_qml_modules.py
          tests/test_qml_resolution.py
          tests/test_calls_cpp.py
          tests/test_calls_js.py
          tests/test_calls_multilang.py
          tests/test_golden_extraction.py
          tests/test_golden_mcp_shapes.py

      - name: Run evals
        run: python evals/run_evals.py

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*
